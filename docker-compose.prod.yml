services:
  api:
    image: ghcr.io/sumit-dey98/greenfield-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod

# Runs bound to localhost only — nginx on the host is the public-facing reverse proxy
# terminating TLS and forwarding to 127.0.0.1:8000. Postgres is Neon (external), so no
# db service here. See DEPLOY.md for the one-time VM + nginx + certbot setup.
#
# NOT used by the current deploy path (Render deploys straight from the Dockerfile via its
# own GitHub integration). This file is kept for the future Oracle VM migration described
# in DEPLOY.md.
